name: Docker image

on:
    workflow_call:
        inputs:
            version_bump:
                description: patch, minor or major; applied to the latest release tag when publishing
                type: string
                default: patch
            disable_publish:
                description: Only build, never push the image
                type: boolean
                default: false

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        concurrency:
            group: docker-image-${{ github.repository }}-${{ github.ref }}
        steps:
            - name: Setup / Publish check
              id: ci
              uses: psychodracon/github-workflows/.github/actions/publish-check@v1
              with:
                  disable_publish: ${{ inputs.disable_publish }}

            - name: Setup / Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ steps.ci.outputs.ref }}

            - name: Setup / Version
              id: version
              if: steps.ci.outputs.publish == 'true'
              uses: psychodracon/github-workflows/.github/actions/version@v1
              with:
                  type: tags
                  bump: ${{ inputs.version_bump }}

            - name: Image / Build
              id: image
              uses: psychodracon/github-workflows/.github/actions/docker-build@v1
              with:
                  version: ${{ steps.version.outputs.version }}

            # The image is pushed only once the version is tagged.
            - name: Repo / Tag version
              if: steps.ci.outputs.publish == 'true'
              uses: psychodracon/github-workflows/.github/actions/git-release@v1
              with:
                  version: ${{ steps.version.outputs.version }}

            - name: Image / Push
              if: steps.ci.outputs.publish == 'true'
              uses: psychodracon/github-workflows/.github/actions/docker-push@v1
              with:
                  tags: ${{ steps.image.outputs.tags }}
