name: CI

on:
    pull_request:
        paths-ignore:
            - "**.md"
            - renovate.json
            - LICENSE
    push:
        branches:
            - main
        paths-ignore:
            - "**.md"
            - renovate.json
            - LICENSE
    workflow_dispatch:
        inputs:
            version_bump:
                description: Release bump; major also needs the internal @vN refs moved to the new major first
                type: choice
                options:
                    - patch
                    - minor
                    - major
                default: patch

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        permissions:
            contents: write
        concurrency:
            group: ci-${{ github.ref }}
            cancel-in-progress: ${{ github.event_name == 'pull_request' }}
        steps:
            - name: Setup / Checkout repository
              uses: actions/checkout@v7

            - name: Setup / Publish check
              id: ci
              uses: ./.github/actions/publish-check

            - name: Setup / Tools
              uses: jdx/mise-action@v5

            - name: Build / actionlint
              run: actionlint

            - name: Build / Version tests
              run: test/version.test.sh

            - name: Repo / Next version
              id: version
              if: steps.ci.outputs.publish == 'true'
              uses: ./.github/actions/version
              with:
                  type: tags
                  bump: ${{ inputs.version_bump }}

            - name: Repo / Tag version
              if: steps.ci.outputs.publish == 'true'
              uses: ./.github/actions/git-release
              with:
                  version: ${{ steps.version.outputs.version }}
                  major_tag: "true"
