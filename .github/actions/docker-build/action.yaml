name: Docker build
description: Builds the repository's Dockerfile for linux/amd64. With a version it tags the image <version> and latest and loads it into the local Docker daemon for docker-push.

inputs:
  context:
    description: Build context holding the Dockerfile
    required: false
    default: .
  version:
    description: Release version; empty builds without tags (pull requests)
    required: false
    default: ''
  npmrc:
    description: Path of a .npmrc exposed to the build as the BuildKit secret "npmrc"
    required: false
    default: ''

outputs:
  tags:
    description: Newline-separated image tags
    value: ${{ steps.meta.outputs.tags }}

runs:
  using: composite
  steps:
    - name: Image / Determine name
      id: image
      shell: bash
      run: |
        echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Image / Metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ steps.image.outputs.name }}
        flavor: latest=false
        tags: |
          type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=raw,value=latest,enable=${{ inputs.version != '' }}
        labels: |
          org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
          org.opencontainers.image.version=${{ inputs.version }}

    - name: Image / Setup Buildx
      uses: docker/setup-buildx-action@v4

    - name: Image / Build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        platforms: linux/amd64
        load: ${{ inputs.version != '' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        secret-files: ${{ inputs.npmrc != '' && format('npmrc={0}', inputs.npmrc) || '' }}
