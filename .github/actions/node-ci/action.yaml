name: Node CI
description: Runs npm ci, then the lint, build and test scripts that exist in package.json. Expects Node.js from setup-node.

inputs:
  working_directory:
    description: Directory containing package.json
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Build / Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: npm ci

    - name: Build / Lint, build and test
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        for script in lint build test; do
          if [[ "$(npm pkg get "scripts.${script}")" == "{}" ]]; then
            echo "::notice::Skipping '${script}': no such script in package.json"
          else
            echo "::group::npm run ${script}"
            npm run "$script"
            echo "::endgroup::"
          fi
        done
