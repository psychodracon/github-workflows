name: Set up Node.js
description: Installs Node.js from .nvmrc, caches npm downloads keyed on package-lock.json, and writes a user .npmrc mapping the owner scope to GitHub Packages.

inputs:
  working_directory:
    description: Directory containing .nvmrc
    required: false
    default: .
  registry_token:
    description: Token for GitHub Packages (packages:write to publish, packages:read to install)
    required: false
    default: ${{ github.token }}

outputs:
  npmrc:
    description: Path of the generated .npmrc
    value: ${{ steps.npmrc.outputs.path }}

runs:
  using: composite
  steps:
    - name: Setup / Node
      uses: actions/setup-node@v7
      with:
        node-version-file: ${{ inputs.working_directory }}/.nvmrc
        cache: npm
        cache-dependency-path: ${{ inputs.working_directory }}/package-lock.json

    - name: Setup / npm registry
      id: npmrc
      shell: bash
      env:
        REGISTRY_TOKEN: ${{ inputs.registry_token }}
      run: |
        npmrc="${RUNNER_TEMP}/.npmrc"
        {
          echo "@${GITHUB_REPOSITORY_OWNER,,}:registry=https://npm.pkg.github.com"
          echo "//npm.pkg.github.com/:_authToken=${REGISTRY_TOKEN}"
        } > "$npmrc"
        echo "NPM_CONFIG_USERCONFIG=${npmrc}" >> "$GITHUB_ENV"
        echo "path=${npmrc}" >> "$GITHUB_OUTPUT"
