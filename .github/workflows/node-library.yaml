name: Node library

on:
    workflow_call:
        inputs:
            version_bump:
                description: patch, minor or major; applied before the build when publishing
                type: string
                default: patch
            disable_publish:
                description: Only build and test, never publish
                type: boolean
                default: false

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write
        concurrency:
            group: node-library-${{ github.repository }}-${{ github.ref }}
        steps:
            - name: Setup / Publish check
              id: ci
              uses: psychodracon/github-workflows/.github/actions/publish-check@v1
              with:
                  disable_publish: ${{ inputs.disable_publish }}

            - name: Setup / Checkout repository
              uses: actions/checkout@v7
              with:
                  ref: ${{ steps.ci.outputs.ref }}

            - name: Setup / Node
              uses: psychodracon/github-workflows/.github/actions/setup-node@v1

            - name: Setup / Version
              id: version
              if: steps.ci.outputs.publish == 'true'
              uses: psychodracon/github-workflows/.github/actions/version@v1
              with:
                  type: npm
                  bump: ${{ inputs.version_bump }}

            - name: Build / Node
              uses: psychodracon/github-workflows/.github/actions/node-ci@v1

            - name: Repo / Commit and tag version
              if: steps.ci.outputs.publish == 'true'
              uses: psychodracon/github-workflows/.github/actions/git-release@v1
              with:
                  version: ${{ steps.version.outputs.version }}
                  files: ${{ steps.version.outputs.files }}

            - name: Publish / npm
              if: steps.ci.outputs.publish == 'true'
              run: npm publish
