name: Version
description: 'Works out the version to release and bumps the version files in the working tree without committing; git-release commits them. Releases the file version unchanged while its tag does not exist yet, otherwise bumps it.'

inputs:
  type:
    description: 'npm (package.json, and package-lock.json if present, in each path), msbuild (<Version> in each path) or tags (latest v* tag, no file)'
    required: true
  paths:
    description: 'Space-separated directories (npm) or files (msbuild); ignored for tags'
    required: false
    default: .
  bump:
    description: 'patch, minor, major, revision (four-part versions only), or auto (major after a breaking commit, "type!:" or "BREAKING CHANGE:", since the latest release tag; otherwise patch)'
    required: false
    default: patch
  tag_prefix:
    description: Prefix of the release tags
    required: false
    default: v

outputs:
  version:
    description: Version to release
  files:
    description: Space-separated files changed by the bump; empty when the version is released unchanged

runs:
  using: node24
  main: version.mjs
